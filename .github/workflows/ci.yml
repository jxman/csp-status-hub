name: CI

# Runs on every push to main and on pull requests. The "ci-checks" job is the
# Vercel Deployment Check: a production deployment is built as soon as main is
# pushed, but it isn't promoted to cloudstatus.synepho.com until this job passes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-checks:
    # Job name = GitHub check name that Vercel waits for. Keep it unique:
    # the scheduled workflows' "verify" jobs must not satisfy this gate.
    name: ci-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # "build" runs tsc -b (src/, api/, vite.config.ts) and then vite build
      - run: npm run build
